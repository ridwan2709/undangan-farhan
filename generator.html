<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Link Undangan Pernikahan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      color: #2c3e50;
      text-align: center;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="text"], input[type="url"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="url"]:focus, textarea:focus {
      border-color: #4a90e2;
    }

    button.btn-generate {
      width: 100%;
      background-color: #4a90e2;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button.btn-generate:hover {
      background-color: #357abd;
    }

    /* Output Section */
    .output-section {
      margin-top: 25px;
      border-top: 2px dashed #e0e0e0;
      padding-top: 20px;
      display: none;
    }

    .result-box {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .result-content {
      font-size: 0.95rem;
      word-break: break-all;
      color: #222;
      white-space: pre-wrap;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-copy {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .btn-copy:hover {
      background-color: #cbd5e0;
    }

    .btn-wa {
      background-color: #25d366;
      color: white;
    }

    .btn-wa:hover {
      background-color: #1ebc57;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Generator Link Undangan</h1>
    <p class="subtitle">Buat link khusus dan pesan WhatsApp untuk tamu undangan</p>

    <!-- Base URL Website Undangan -->
    <div class="form-group">
      <label for="baseUrl">URL Website Undangan:</label>
      <input type="url" id="baseUrl" value="https://kitangundang.online" placeholder="https://kitangundang.online">
    </div>

    <!-- Nama Tamu -->
    <div class="form-group">
      <label for="guestName">Nama Tamu Undangan:</label>
      <input type="text" id="guestName" placeholder="Contoh: Bapak Ridwan & Keluarga">
    </div>

    <!-- Templat Pesan WA -->
    <div class="form-group">
      <label for="templateMessage">Draf Pesan WhatsApp:</label>
      <textarea id="templateMessage" rows="8">Kepada Yth.
Bapak/Ibu/Saudara/i [NAMA]

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.

Berikut link undangan digital kami untuk informasi lengkap acara:
[LINK]

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.

Atas perhatiannya kami ucapkan terima kasih.
Salam hangat,
Farhan & Susi</textarea>
    </div>

    <button class="btn-generate" onclick="generateLink()">Buat Link & Pesan</button>

    <!-- Hasil Output -->
    <div class="output-section" id="outputSection">
      
      <!-- Box Link Sahaja -->
      <div class="result-box">
        <div class="result-title">Link Undangan Khusus:</div>
        <div class="result-content" id="generatedUrl"></div>
      </div>

      <!-- Box Pesan WA Lengkap -->
      <div class="result-box">
        <div class="result-title">Pesan Siap Kirim (WhatsApp):</div>
        <div class="result-content" id="generatedMessage"></div>
      </div>

      <div class="btn-group">
        <button class="btn-action btn-copy" onclick="copyText()">📋 Copy Pesan</button>
        <a id="waShareBtn" class="btn-action btn-wa" target="_blank" href="#">💬 Kirim WA</a>
      </div>

    </div>
  </div>

  <div class="toast" id="toastNotification">Pesan berhasil disalin!</div>

  <script>
    function generateLink() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const guestName = document.getElementById('guestName').value.trim();
      const template = document.getElementById('templateMessage').value;

      if (!baseUrl) {
        alert("Mohon masukkan URL website undangan Anda!");
        return;
      }

      if (!guestName) {
        alert("Mohon masukkan nama tamu undangan!");
        return;
      }

      // Mengubah spasi menjadi tanda + pada nama untuk URL
      const formattedName = encodeURIComponent(guestName).replace(/%20/g, '+');
      
      // Gabungkan Base URL dengan parameter 'to='
      const separator = baseUrl.includes('?') ? '&' : '?';
      const finalUrl = `${baseUrl}${separator}to=${formattedName}`;

      // Ganti placeholder [NAMA] dan [LINK] dalam template pesan
      let finalMessage = template.replace(/\[NAMA\]/g, guestName);
      finalMessage = finalMessage.replace(/\[LINK\]/g, finalUrl);

      // Tampilkan hasil di halaman
      document.getElementById('generatedUrl').innerText = finalUrl;
      document.getElementById('generatedMessage').innerText = finalMessage;
      
      // Buat link ke API WhatsApp
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(finalMessage)}`;
      document.getElementById('waShareBtn').href = waUrl;

      // Tampilkan kontainer output
      document.getElementById('outputSection').style.display = 'block';
    }

    function copyText() {
      const textToCopy = document.getElementById('generatedMessage').innerText;
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast();
      }).catch(err => {
        alert("Gagal menyalin teks.");
      });
    }

    function showToast() {
      const toast = document.getElementById('toastNotification');
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }
  </script>

</body>
</html>
